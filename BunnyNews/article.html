<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel</title>
  <script src="article.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">

  <!-- Dark mode toggle -->
  <div class="flex justify-end p-4">
    <button onclick="document.documentElement.classList.toggle('dark')"
      class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 dark:bg-yellow-300 dark:text-black dark:hover:bg-yellow-400">
      Toggle Dark Mode
    </button>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-10 bg-green-200 dark:bg-gray-800 border-b-2 border-black dark:border-gray-700">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 sm:px-6 py-4">
      <div class="flex items-center gap-4">
        <img src="./images/noun-bunny-208196.png" alt="Cartoon bunny logo" class="w-12 sm:w-16 md:w-20" />
        <h1 class="text-2xl sm:text-3xl md:text-5xl font-bold">Bunny News</h1>
      </div>
      <div class="relative overflow-hidden w-full md:w-auto">
        <nav class="flex overflow-x-auto gap-2 mt-4 md:mt-0 px-1 whitespace-nowrap scrollbar-hide pr-8">
          <button class="dropbtn">News</button>
          <button class="dropbtn">Sports</button>
          <button class="dropbtn">Videos</button>
          <button class="dropbtn">About Us</button>
        </nav>
        <div
          class="pointer-events-none absolute right-0 top-0 h-full w-8 bg-gradient-to-l from-green-200 dark:from-gray-800 to-transparent">
        </div>
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto">
    <a href="index.html" class="text-blue-600 dark:text-yellow-300 hover:underline">&larr; Back</a>
    <h1 id="article-title" class="text-3xl font-bold mt-4"></h1>
    <p id="article-date" class="text-sm text-gray-500 mb-4"></p>
    <div id="article-content" class="text-lg"></div>
  </main>
</body>
</html>
