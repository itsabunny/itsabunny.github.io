<!DOCTYPE html>
<html lang="en-GB" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Ninis Blomerus" />
  <link rel="icon" href="./images/noun-bunny-208196.png" />
  <script src="index.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="./style.css">
  <title>Bunny News</title>
</head>

<body class="bg-green-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">


  <!-- Header -->
  <header class="sticky top-0 z-10 bg-green-200 dark:bg-gray-800 border-b-2 border-black dark:border-gray-700">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 py-4">
      <div class="flex items-center gap-4">
        <img src="./images/noun-bunny-208196.png" alt="Cartoon bunny logo" class="w-12 sm:w-16 md:w-20" />
        <h1 class="text-3xl md:text-5xl font-bold">Bunny News</h1>
      </div>
      <nav class="flex gap-2 mt-4 md:mt-0">
        <button class="dropbtn">News</button>
        <button class="dropbtn">Sports</button>
        <button class="dropbtn">Videos</button>
        <button class="dropbtn">About Us</button>
      </nav>
      <!-- Dark mode toggle -->
      <div class="flex justify-end p-4">
        <button onclick="document.documentElement.classList.toggle('dark')"
          class="bg-gray-800 text-white px-4 py-2 rounded dark:bg-yellow-300 dark:text-black hover:bg-gray-700 dark:hover:bg-yellow-400">
          Toggle Dark Mode
        </button>
      </div>
    </div>
  </header>

  <!-- Layout -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 px-4 py-4">
    <aside class="md:col-span-1 bg-blue-100 dark:bg-gray-800 p-4 rounded shadow">
      <button id="addNewArticleButton" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Add New Article
      </button>
      <h2 class="text-xl font-semibold mb-2">Latest Headlines</h2>
      <ul id="latest-articles" class="space-y-1 text-sm"></ul>
    </aside>

    <main class="md:col-span-3 bg-white dark:bg-gray-800 p-4 rounded shadow animate-fade-in">
      <h2 class="text-2xl font-bold mb-4">Latest articles</h2>
      <div id="articles" class="space-y-4"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="addNewArticle" class="modal">
    <div class="modal-content p-4 rounded shadow-lg bg-white dark:bg-gray-700 max-w-md mx-auto mt-20">
      <span class="close text-red-500 text-xl float-right cursor-pointer">&times;</span>
      <h2 class="text-xl font-bold mb-4">New article</h2>
      <form id="articleForm" class="space-y-4">
        <div>
          <label for="title" class="block font-semibold">Title:</label>
          <input type="text" id="title" required class="w-full p-2 border rounded" />
        </div>
        <div>
          <label for="content" class="block font-semibold">Content:</label>
          <textarea id="content" rows="4" class="w-full p-2 border rounded"></textarea>
        </div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Save</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-black text-white px-4 py-2 rounded hidden z-50"></div>

  <!-- Footer -->
  <footer class="bg-green-300 dark:bg-gray-700 text-center py-4 mt-10">
    <p>Follow us:</p>
    <div class="flex justify-center gap-4 mt-2">
      <a href="#" class="hover:underline">Facebook</a>
      <a href="#" class="hover:underline">Instagram</a>
      <a href="#" class="hover:underline">Twitter</a>
    </div>
  </footer>

</body>

</html>
